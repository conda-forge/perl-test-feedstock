{% set name = "perl-test" %}
{% set version = "1.26" %}
{% set sha256 = "f7701bd28e05e7f82fe9a181bbab38f53fa6aeae48d2a810da74d1b981d4f392" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/J/JE/JESSE/Test-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 1
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
    - perl-test-harness
    #- perl-file-spec
  run:
    - perl
    - perl-test-harness
    #- perl-file-spec

test:
  imports:
    - Test

about:
  home: https://metacpan.org/dist/Test
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'provides a simple framework for writing test scripts'
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod

extra:
  recipe-maintainers:
    - cbrueffer
